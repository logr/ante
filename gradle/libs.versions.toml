[versions]
agp = "9.3.1"
kotlin = "2.4.10"

composeBom = "2026.08.00"
desugarJdkLibs = "2.1.5"

androidxActivity = "1.13.0"
androidxCore = "1.19.0"

spotless = "8.9.0"
ktfmt = "0.64"

junit = "4.13.2"
kotest = "6.2.3"
roborazzi = "1.72.0"
# 4.16.1 rather than the 4.17 betas. See core/designsystem/src/test/resources/robolectric.properties
# for why the rendered SDK is pinned below compileSdk.
robolectric = "4.16.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

# TODO(detekt): no detekt release currently works on this stack.
#   io.gitlab.arturbosch:detekt 1.23.8 (last stable) is built against Gradle 8.12.1 /
#     Kotlin 2.0.21 / AGP 8.8.1 and derives its Android variant tasks from KGP, which
#     AGP 9's built-in Kotlin never applies -> no tasks are created.
#   dev.detekt:detekt-gradle-plugin 2.0.0-alpha.x compiles against the AGP API and does
#     support built-in Kotlin, but ships with configuration cache disabled, which
#     conflicts with org.gradle.configuration-cache=true in gradle.properties.
# Revisit when detekt 2.0 is stable and configuration-cache compatible.

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

# Versions come from the BOM below -- do not pin these individually.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# roborazzi-compose declares almost nothing transitively -- Robolectric and the Compose test
# artifacts are compileOnly on its side, so every consumer supplies them.
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

junit = { module = "junit:junit", version.ref = "junit" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Runtime only, for reading the token sheet in tests. No @Serializable classes and therefore no
# kotlin-serialization compiler plugin -- the conformance test navigates JsonObject by hand.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
