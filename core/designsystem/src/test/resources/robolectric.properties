# Pinned below compileSdk (37) on purpose. Letting Robolectric infer the SDK means the rendered
# platform can change under us on a dependency bump, which silently churns every golden: system
# fonts and framework resources differ between platform versions. Robolectric 4.16.1 does not
# ship an SDK 37 runtime anyway.
sdk=36

# Native Skia rendering rather than the legacy shadow pipeline. Compose needs it to produce real
# pixels rather than a blank canvas.
graphicsMode=NATIVE
