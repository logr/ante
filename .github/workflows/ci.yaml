name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repo is public, so fork PRs run this workflow. Checkout is all it needs.
permissions:
  contents: read

jobs:
  build:
    # Must match runs-on in record-goldens.yaml. verifyRoborazziDebug compares at an exact match, so
    # the recording and verifying images must not drift apart if the image ever does affect a render
    # -- see that file for why this is precaution rather than an observed difference.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Verifies the committed gradle-wrapper.jar against known-good checksums.
      - uses: gradle/actions/wrapper-validation@v6

      # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Handles dependency and build caching -- do not hand-roll actions/cache.
      - uses: gradle/actions/setup-gradle@v6

      # Configuration cache is enabled via gradle.properties, so no flag is needed here.
      #
      # verifyRoborazziDebug is named explicitly and is not redundant with `test`. Roborazzi
      # only compares against goldens when the verify task puts the test JVM in verify mode;
      # under plain `test` the same screenshot tests run and pass without comparing anything.
      # Dropping it back to `test` alone makes the screenshot check silently decorative.
      - run: ./gradlew assemble lint test verifyRoborazziDebug spotlessCheck

      # Roborazzi writes comparison images (<name>_compare.png) under build/outputs/roborazzi
      # and an HTML report under build/reports/roborazzi. Without this upload, a failed verify
      # is a red check with no image, and recording is an approval step -- the reviewer has to
      # be able to see what they would be approving.
      #
      # if-no-files-found is ignore because this fires on any failure of the gradle step; a
      # lint or spotless failure produces no comparison images, and that is not an error.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-comparisons
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
          if-no-files-found: ignore
