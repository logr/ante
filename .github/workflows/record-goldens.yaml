name: Record screenshot goldens

# Manual only, and the canonical recorder.
#
# Not because the host OS has been observed to matter -- re-recording here reproduced the
# macOS-recorded goldens byte for byte (2026-08-14, run 31840147580), since @GraphicsMode(NATIVE)
# renders through the Skia build and fonts bundled with Robolectric rather than the host's.
# Nothing guarantees that keeps holding: a Robolectric or font-bundle bump could reintroduce a
# host difference, and comparison runs at an exact match (see TokenSampleScreenshotTest) with no
# tolerance to absorb one.
#
# Goldens may also be recorded locally -- fork PRs cannot dispatch this workflow and have no
# other path (see CONTRIBUTING.md). That loosens nothing: verifyRoborazziDebug re-renders
# every PR on ci.yaml's pinned runner and rejects any golden that is not pixel-identical to
# that render, so a recording from a drifting environment turns the gate red instead of
# merging. For maintainer branches this workflow stays the better path: the update arrives as
# a reviewable bot commit recorded in a known environment.
#
# Run it from the Actions tab against the branch whose goldens need updating.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Wider than ci.yaml's read-only permissions on purpose: this workflow's whole point is pushing
# the re-recorded goldens back. It is workflow_dispatch-only, so a fork PR cannot reach it.
permissions:
  contents: write
  # Lets the commit step dispatch ci.yaml on this branch after pushing (see that step).
  actions: write

jobs:
  record:
    # Pinned rather than ubuntu-latest as insurance, not against an observed failure: renders have
    # so far been identical across hosts, but comparison is an exact match, so if the image ever
    # does affect one, a silent rollover to the next LTS would fail goldens on an unrelated PR and
    # read as a UI regression. Bump deliberately, and re-record in the same change if it moves the
    # goldens. Must match runs-on in ci.yaml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Verifies the committed gradle-wrapper.jar against known-good checksums.
      - uses: gradle/actions/wrapper-validation@v6

      # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Handles dependency and build caching -- do not hand-roll actions/cache.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew recordRoborazziDebug

      - name: Commit re-recorded goldens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A wildcard pathspec is matched against file paths, so a trailing slash matches
          # nothing: 'screenshots/' aborts where 'screenshots/*.png' works. The wildcard is
          # worth keeping -- if the goldens ever move, this fails the step rather than falling
          # through to the "nothing to commit" branch below and reporting a false success.
          git add -A -- '*/src/test/screenshots/*.png'
          if git diff --staged --quiet; then
            echo "Goldens already match this runner. Nothing to commit."
            exit 0
          fi
          git commit -m "Record screenshot goldens on CI"
          git push
          # That push used GITHUB_TOKEN, so it fired no pull_request event: the PR would keep
          # showing CI for the commit *before* these goldens. Dispatch events are the
          # exception to that rule, so start CI explicitly. gh is preinstalled on
          # GitHub-hosted runners.
          gh workflow run ci.yaml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
